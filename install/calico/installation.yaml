apiVersion: crd.projectcalico.org/v1
kind: FelixConfiguration
metadata:
  name: default
  labels: {networking.egress/managed: calico-static-v3.32.2}
spec:
  defaultEndpointToHostAction: Accept
  chainInsertMode: Insert
  ipv6Support: false
  bpfEnabled: false
  # Match node startup defaults so its API conversion does not rewrite metadata.
  reportingInterval: 0s
  logSeverityScreen: Info
