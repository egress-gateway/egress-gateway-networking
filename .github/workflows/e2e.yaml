name: Network E2E
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  network:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: Istio baseline, profile: istio-only, acceptance: baseline, experiment: acceptance}
          - {name: Calico enforce, profile: calico-istio, acceptance: enforce, experiment: acceptance}
          - {name: Additive allow negative control, profile: calico-istio, acceptance: enforce, experiment: negative}
    env:
      E2E_ARGS: --profile=${{ matrix.profile }} --acceptance=${{ matrix.acceptance }}
      EXPERIMENT: ${{ matrix.experiment }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.7'
          cache: true
      - name: Register every acceptance case before environment setup
        id: inventory
        run: |
          command=inventory
          if [[ "$EXPERIMENT" == negative ]]; then command=inventory-negative; fi
          go run ./cmd/networking-e2e "$command" $E2E_ARGS
      - id: prerequisites
        run: sudo apt-get update && sudo apt-get install -y jq gettext-base
      - id: tools
        run: bash scripts/ci-tools.sh
      - id: network
        run: |
          if [[ "$EXPERIMENT" == acceptance ]]; then
            make e2e
          else
            make e2e-up
            set +e
            make e2e-negative
            result=$?
            set -e
            test "$result" -ne 0
            jq -es 'length == 1 and all(.verified == true and .observed == "violated" and .restored == "satisfied")' .e2e/artifacts/run-*/negative-control.json
          fi
      - name: Clean the negative control environment
        id: cleanup
        if: always() && matrix.experiment == 'negative'
        run: |
          if [[ -d .e2e/state ]]; then make e2e-down; fi
      - name: Publish complete case table
        if: always()
        env:
          CI_OUTCOMES: 'inventory=${{ steps.inventory.outcome }} prerequisites=${{ steps.prerequisites.outcome }} tools=${{ steps.tools.outcome }} network=${{ steps.network.outcome }}'
        run: go run ./cmd/networking-e2e summary --ci-outcomes "$CI_OUTCOMES" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload safe network diagnostics
        id: evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: networking-e2e-${{ matrix.profile }}-${{ matrix.experiment }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: .e2e/artifacts/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
      - name: Link report bundle
        if: always()
        env:
          EVIDENCE_URL: ${{ steps.evidence.outputs.artifact-url }}
        run: |
          test -n "$EVIDENCE_URL"
          printf '\n[Download the complete report and case evidence](%s)\n' "$EVIDENCE_URL" >> "$GITHUB_STEP_SUMMARY"
