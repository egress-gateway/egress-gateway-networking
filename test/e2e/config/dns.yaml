apiVersion: v1
kind: Namespace
metadata:
  name: ${DNS_NAMESPACE}
  labels: {istio-injection: enabled}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: client, namespace: ${DNS_NAMESPACE}}
---
apiVersion: v1
kind: Pod
metadata:
  name: receiver
  namespace: ${DNS_NAMESPACE}
  labels: {app: receiver}
  annotations: {sidecar.istio.io/inject: 'false'}
spec:
  automountServiceAccountToken: false
  containers:
    - name: probe
      image: ${PROBE_IMAGE}
      imagePullPolicy: Never
      args: [serve, --http, '8080', --https, '8443', --tcp, '9000']
      securityContext: {runAsUser: 10000, allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
      volumeMounts: [{name: certificates, mountPath: /certs, readOnly: true}]
  volumes:
    - name: certificates
      secret: {secretName: receiver-certificates}

---
apiVersion: v1
kind: Pod
metadata:
  name: control
  namespace: ${DNS_NAMESPACE}
  labels: {app: dns-control}
  annotations: {sidecar.istio.io/inject: 'false'}
spec:
  automountServiceAccountToken: false
  containers:
    - name: probe
      image: ${PROBE_IMAGE}
      imagePullPolicy: Never
      args: [idle]
      securityContext: {runAsUser: 10000, allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
      volumeMounts: [{name: trust, mountPath: /trust, readOnly: true}]
  volumes:
    - name: trust
      configMap: {name: dns-trust}
