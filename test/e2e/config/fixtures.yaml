apiVersion: v1
kind: Namespace
metadata:
  name: networking-test
  labels:
    istio-injection: enabled
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: curl
  namespace: networking-test
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: httpbin
  namespace: networking-test
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: curl
  namespace: networking-test
spec:
  replicas: 1
  selector:
    matchLabels: {app: curl}
  template:
    metadata:
      labels: {app: curl}
    spec:
      serviceAccountName: curl
      containers:
        - name: curl
          image: ${CURL_IMAGE}
          command: [sleep, infinity]
          resources:
            requests: {cpu: 10m, memory: 16Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: httpbin
  namespace: networking-test
spec:
  replicas: 1
  selector:
    matchLabels: {app: httpbin}
  template:
    metadata:
      labels: {app: httpbin}
    spec:
      serviceAccountName: httpbin
      containers:
        - name: httpbin
          image: ${HTTPBIN_IMAGE}
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: {path: /status/200, port: 8080}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: httpbin
  namespace: networking-test
spec:
  selector: {app: httpbin}
  ports:
    - name: http
      port: 8000
      targetPort: 8080
---
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: strict
  namespace: networking-test
spec:
  mtls: {mode: STRICT}
---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: httpbin
  namespace: networking-test
spec:
  host: httpbin.networking-test.svc.cluster.local
  trafficPolicy:
    tls: {mode: ISTIO_MUTUAL}
