apiVersion: v1
kind: Pod
metadata:
  name: ${DNS_CLIENT}
  namespace: networking-dns
  labels: {app: dns-client, networking.dns/protected: 'true'}
  annotations:
    sidecar.istio.io/inject: 'true'
    proxy.istio.io/config: '{"holdApplicationUntilProxyStarts":false}'
spec:
  containers:
    - name: probe
      image: ${PROBE_IMAGE}
      imagePullPolicy: Never
      args: [idle]
      securityContext: {runAsUser: 10000, allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
      volumeMounts: [{name: trust, mountPath: /trust, readOnly: true}]
  volumes:
    - name: trust
      configMap: {name: dns-trust}
