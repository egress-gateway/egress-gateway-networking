apiVersion: v1
kind: Pod
metadata:
  name: ${NP_NAME}
  namespace: ${NP_NAMESPACE}
  labels: {app: '${NP_NAME}'}
spec:
  automountServiceAccountToken: false
  containers:
    - name: httpbin
      image: ${HTTPBIN_IMAGE}
      ports: [{containerPort: 8080}]
      readinessProbe:
        httpGet: {path: /status/200, port: 8080}
    - name: wrong-port
      image: ${PROBE_IMAGE}
      imagePullPolicy: Never
      args: [serve, --tcp, '19090', --udp, '19090']
      securityContext: {runAsUser: 10000, allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
---
apiVersion: v1
kind: Service
metadata: {name: '${NP_NAME}', namespace: '${NP_NAMESPACE}'}
spec:
  selector: {app: '${NP_NAME}'}
  ports: [{name: http, port: 8000, targetPort: 8080}]
