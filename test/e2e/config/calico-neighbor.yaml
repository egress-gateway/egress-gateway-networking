apiVersion: v1
kind: Pod
metadata:
  name: network-neighbor
  namespace: ${NEIGHBOR_NAMESPACE}
  labels: {app: network-neighbor}
  annotations: {sidecar.istio.io/inject: 'false'}
spec:
  automountServiceAccountToken: false
  containers:
    - name: probe
      image: ${PROBE_IMAGE}
      imagePullPolicy: Never
      args: [serve, --tcp, '${NEIGHBOR_PORT}', --dns, '53']
      securityContext: {runAsUser: 10000, allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
