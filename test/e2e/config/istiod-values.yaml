# Test evidence only; shared installations do not enable these access logs.
meshConfig:
  accessLogFile: /dev/stdout
  accessLogEncoding: JSON
  accessLogFormat: |
    {"test_id":"%REQ(X-NETWORKING-TEST-ID)%","method":"%REQ(:METHOD)%","path":"%REQ(:PATH)%","code":"%RESPONSE_CODE%","upstream_cluster":"%UPSTREAM_CLUSTER%","upstream_tls":"%UPSTREAM_TLS_VERSION%","upstream_peer":"%UPSTREAM_PEER_URI_SAN%","downstream_tls":"%DOWNSTREAM_TLS_VERSION%","downstream_peer":"%DOWNSTREAM_PEER_URI_SAN%","source_ip":"%DOWNSTREAM_DIRECT_REMOTE_ADDRESS_WITHOUT_PORT%","details":"%RESPONSE_CODE_DETAILS%","downstream_failure":"%DOWNSTREAM_TRANSPORT_FAILURE_REASON%","transport_failure":"%UPSTREAM_TRANSPORT_FAILURE_REASON%","upstream_local":"%UPSTREAM_LOCAL_ADDRESS%","upstream_host":"%UPSTREAM_HOST%","downstream_remote":"%DOWNSTREAM_DIRECT_REMOTE_ADDRESS%","downstream_local":"%DOWNSTREAM_LOCAL_ADDRESS%","sni":"%REQUESTED_SERVER_NAME%","bytes_received":"%BYTES_RECEIVED%","bytes_sent":"%BYTES_SENT%"}
  defaultConfig:
    holdApplicationUntilProxyStarts: true
