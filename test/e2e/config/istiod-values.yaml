# Test evidence only; shared installations do not enable these access logs.
meshConfig:
  accessLogFile: /dev/stdout
  accessLogEncoding: JSON
  accessLogFormat: |
    {"test_id":"%REQ(X-NETWORKING-TEST-ID)%","method":"%REQ(:METHOD)%","path":"%REQ(:PATH)%","code":"%RESPONSE_CODE%","upstream_cluster":"%UPSTREAM_CLUSTER%","upstream_tls":"%UPSTREAM_TLS_VERSION%","upstream_peer":"%UPSTREAM_PEER_URI_SAN%","downstream_tls":"%DOWNSTREAM_TLS_VERSION%","downstream_peer":"%DOWNSTREAM_PEER_URI_SAN%","source_ip":"%DOWNSTREAM_DIRECT_REMOTE_ADDRESS_WITHOUT_PORT%","details":"%RESPONSE_CODE_DETAILS%","transport_failure":"%UPSTREAM_TRANSPORT_FAILURE_REASON%"}
  defaultConfig:
    holdApplicationUntilProxyStarts: true
